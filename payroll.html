<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHOBANK - Sistem Payroll</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            color: #000000;
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            font-family: 'Outfit', 'Montserrat', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 20% 35%, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 24px 48px;
            position: relative;
            z-index: 2;
        }

        .site-header {
            text-align: center;
            margin-bottom: 32px;
            padding: 12px 0 8px;
            background: transparent;
        }

        .header-chobank {
            font-family: 'Outfit', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #000000;
            line-height: 1.2;
        }

        .tagline-mini {
            font-size: 0.9rem;
            color: #4a4a4a;
            margin-top: 8px;
            font-weight: 500;
        }

        .form-container {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 48px;
            padding: 32px 28px;
            width: 100%;
            box-shadow: 0 15px 35px -12px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .form-container:hover {
            background: rgba(255,255,255,0.82);
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12);
        }

        .form-container h2 {
            font-size: 28px;
            margin-bottom: 28px;
            color: #000000;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.2px;
            font-family: 'Outfit', sans-serif;
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .form-container h2:after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: #000;
            margin: 12px auto 0;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #000000;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid rgba(0,0,0,0.2);
            border-radius: 32px;
            background-color: #ffffff;
            color: #111;
            font-size: 15px;
            transition: all 0.25s ease;
            font-family: 'Outfit', sans-serif;
            outline: none;
        }

        .form-control:focus {
            border-color: #000000;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
            transform: translateY(-1px);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 16px;
        }

        .currency-group {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .currency-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .currency-option input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .row-2cols {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .row-2cols .form-group {
            flex: 1;
            min-width: 140px;
        }
        
        .row-3cols {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .row-3cols .form-group {
            flex: 1;
            min-width: 110px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 32px;
            width: 100%;
        }

        .action-btn {
            display: block;
            padding: 14px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            border: 1.5px solid #000000;
            font-size: 0.95rem;
            text-align: center;
            width: 100%;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            background: transparent;
        }

        .btn-primary {
            background: #000000;
            color: #ffffff;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }

        .btn-primary:hover {
            background: #1c1c1c;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -6px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: rgba(0,0,0,0.02);
            color: #000000;
            border: 1.5px solid #111;
        }

        .btn-secondary:hover {
            background: rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 28px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-family: 'Outfit', sans-serif;
        }

        .footer-contacts {
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #2c2c2c;
            line-height: 1.8;
        }

        .footer-contacts a {
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dotted #000;
        }

        .footer-contacts a:hover {
            opacity: 0.7;
        }

        footer p {
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: #4a4a4a;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #eee;
            border-top: 3px solid #000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .slip-preview-container {
            margin-top: 32px;
        }

        .payslip-card {
            background: white;
            color: black;
            padding: 28px 24px;
            border: 1px solid #ccc;
            box-shadow: 0 12px 28px rgba(0,0,0,0.1);
            max-width: 700px;
            margin: 0 auto;
            font-family: 'Outfit', sans-serif;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }
        
        .watermark-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
            opacity: 0.02;
        }
        .watermark-bg img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }
        
        .slip-content-relative {
            position: relative;
            z-index: 2;
            background: transparent;
        }

        .company-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 16px;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        
        .logo-header-img {
            max-width: 70px;
            max-height: 70px;
            object-fit: contain;
            margin-bottom: 8px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        .company-name-header {
            font-size: 26px;
            font-weight: 800;
        }
        
        .company-address {
            font-size: 11px;
            font-weight: 400;
            color: #4a4a4a;
            margin-top: 6px;
        }

        .slip-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin: 12px 0 10px;
            text-transform: uppercase;
        }

        .period-badge {
            text-align: center;
            background: #f0f0f0;
            display: inline-block;
            width: auto;
            padding: 5px 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            border-radius: 40px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            border-bottom: 1px dotted #ddd;
            padding-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .info-label {
            font-weight: 600;
        }

        .info-value {
            font-weight: 500;
            text-align: right;
            word-break: break-word;
        }

        .salary-table {
            width: 100%;
            border-collapse: collapse;
            margin: 18px 0;
            font-size: 14px;
        }

        .salary-table td {
            padding: 10px 6px;
            border-bottom: 1px solid #ccc;
        }

        .salary-table tr:last-child td {
            border-bottom: none;
        }

        .salary-table td:first-child {
            font-weight: 600;
            width: 65%;
        }

        .salary-table td:last-child {
            text-align: right;
            font-weight: 600;
        }

        .total-net {
            background: #f4f4f4;
            font-weight: 800;
            border-top: 2px solid #000;
        }

        .total-net td {
            padding: 12px 6px;
        }

        .footer-note-slip {
            margin-top: 24px;
            text-align: center;
            font-size: 9px;
            font-weight: 400;
            color: #6b6b6b;
            border-top: 1px solid #ccc;
            padding-top: 12px;
        }

        .btn-download {
            background: #000000;
            color: white;
            padding: 12px 28px;
            font-weight: 700;
            font-family: 'Outfit';
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
            border-radius: 40px;
            margin-top: 20px;
            width: 100%;
        }

        .btn-download:hover {
            background: #2b2b2b;
        }

        .message-empty {
            text-align: center;
            background: #f9f9f9;
            padding: 40px 20px;
            border-radius: 32px;
            color: #777;
        }
        
        .logo-preview-small {
            max-width: 60px;
            max-height: 60px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 4px;
        }
        
        @media (min-width: 768px) {
            .container { padding: 28px 36px 48px; }
            .action-buttons { flex-direction: row; gap: 18px; }
            .action-btn { width: auto; flex: 1; }
        }

        @media (max-width: 480px) {
            .header-chobank { font-size: 1.8rem; }
            .form-container { padding: 24px 20px; }
            .payslip-card { padding: 18px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="site-header">
            <div class="header-chobank">CHOBANK</div>
            <div class="tagline-mini">Sistem Payroll</div>
        </div>

        <main class="main-content">
            <section class="form-container fade-in">
                <h2>Buat Slip Gaji</h2>
                
                <form id="payroll-form">
                    <div class="form-group">
                        <label for="logo-upload">Logo Perusahaan (Optional)</label>
                        <input type="file" id="logo-upload" class="form-control" accept="image/*">
                        <div id="logoPreview" style="margin-top: 8px;"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="company-name">Nama Perusahaan</label>
                        <input type="text" id="company-name" class="form-control" placeholder="Nama Perusahaan" value="">
                    </div>
                    
                    <div class="form-group">
                        <label for="company-address">Alamat Perusahaan (Optional)</label>
                        <input type="text" id="company-address" class="form-control" placeholder="Jl. Contoh No. 123, Jakarta" value="">
                    </div>
                    
                    <div class="form-group">
                        <label for="employee-name">Nama Lengkap</label>
                        <input type="text" id="employee-name" class="form-control" placeholder="Nama lengkap karyawan" value="">
                    </div>

                    <div class="form-group">
                        <label for="employee-position">Posisi / Jabatan</label>
                        <input type="text" id="employee-position" class="form-control" placeholder="Contoh: Manager, Staff" value="">
                    </div>
                    
                    <div class="row-2cols">
                        <div class="form-group">
                            <label for="base-salary">Gaji Pokok</label>
                            <input type="number" id="base-salary" class="form-control" placeholder="0" value="" step="1000">
                        </div>
                        <div class="form-group">
                            <label for="salary-increase">Kenaikan Gaji (%)</label>
                            <input type="number" id="salary-increase" class="form-control" placeholder="Persen" value="0" step="0.5">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="custom-tax-percent">Persen Pajak</label>
                        <input type="number" id="custom-tax-percent" class="form-control" placeholder="0" value="0" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>Mata Uang</label>
                        <div class="currency-group">
                            <label class="currency-option">
                                <input type="radio" name="currency" value="IDR" checked> Rupiah (IDR)
                            </label>
                            <label class="currency-option">
                                <input type="radio" name="currency" value="USD"> Dollar (USD)
                            </label>
                        </div>
                    </div>

                    <div class="row-3cols">
                        <div class="form-group">
                            <label for="day-date">Tanggal</label>
                            <input type="number" id="day-date" class="form-control" placeholder="1-31" min="1" max="31" value="">
                        </div>
                        <div class="form-group">
                            <label for="month-select">Bulan</label>
                            <select id="month-select" class="form-control">
                                <option value="Januari">Januari</option>
                                <option value="Februari">Februari</option>
                                <option value="Maret">Maret</option>
                                <option value="April">April</option>
                                <option value="Mei">Mei</option>
                                <option value="Juni">Juni</option>
                                <option value="Juli">Juli</option>
                                <option value="Agustus">Agustus</option>
                                <option value="September">September</option>
                                <option value="Oktober">Oktober</option>
                                <option value="November">November</option>
                                <option value="Desember">Desember</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="year-date">Tahun</label>
                            <input type="number" id="year-date" class="form-control" placeholder="Tahun" value="2026">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="bonus-extra">Bonus / Insentif</label>
                        <input type="number" id="bonus-extra" class="form-control" placeholder="0" value="0" step="100000">
                    </div>
                    
                    <div class="action-buttons">
                        <button type="button" id="generate-slip-btn" class="action-btn btn-primary">Generate Slip Gaji</button>
                        <button type="reset" class="action-btn btn-secondary">Reset Form</button>
                    </div>
                </form>
            </section>
            
            <div class="slip-preview-container" id="slipPreviewContainer">
                <div class="message-empty" id="emptyMessage">
                    Silakan isi data dan klik Generate Slip Gaji
                </div>
                <div id="slipContentArea" style="display: none;"></div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Memproses...</p>
            </div>
        </main>
        
        <footer>
            <div class="footer-contacts">
                <div>Official Account : <a href="https://x.com/thekachoo" target="_blank" rel="noopener noreferrer">@thekachoo</a></div>
                <div>Contact Person for Chobank : <a href="https://x.com/tuaipuji" target="_blank" rel="noopener noreferrer">@tuaipuji</a></div>
                <div>Gmail : <a href="mailto:ohkachoo@gmail.com">ohkachoo@gmail.com</a></div>
            </div>
            <p>© 2026 CHOBANK. All rights reserved.</p>
            <p>Featured by The Kachoo</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generate-slip-btn');
            const resetBtn = document.querySelector('button[type="reset"]');
            const loadingDiv = document.getElementById('loading');
            const emptyMessageDiv = document.getElementById('emptyMessage');
            const slipContentArea = document.getElementById('slipContentArea');
            const logoUpload = document.getElementById('logo-upload');
            let uploadedLogoDataURL = null;
            
            logoUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        uploadedLogoDataURL = ev.target.result;
                        const previewDiv = document.getElementById('logoPreview');
                        previewDiv.innerHTML = `<img src="${uploadedLogoDataURL}" class="logo-preview-small" alt="logo preview">`;
                    };
                    reader.readAsDataURL(file);
                } else {
                    uploadedLogoDataURL = null;
                    document.getElementById('logoPreview').innerHTML = '';
                }
            });
            
            const currentDate = new Date();
            const currentMonthIndex = currentDate.getMonth();
            const monthSelect = document.getElementById('month-select');
            const monthOptions = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            if (currentMonthIndex >= 0) monthSelect.value = monthOptions[currentMonthIndex];
            const yearInput = document.getElementById('year-date');
            if (yearInput && !yearInput.value) yearInput.value = currentDate.getFullYear();
            
            function formatCurrencyIDR(amount) {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(amount);
            }
            function formatCurrencyUSD(amount) {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(amount);
            }
            
            function calculateSalaryWithCustomTax(baseAmount, increasePercent, bonusAmount, customTaxPercent) {
                const increaseValue = baseAmount * (increasePercent / 100);
                const grossSalary = baseAmount + increaseValue + bonusAmount;
                let taxAmount = 0;
                let finalTaxPercent = customTaxPercent || 0;
                if (finalTaxPercent > 0) {
                    taxAmount = grossSalary * (finalTaxPercent / 100);
                }
                const adminFee = grossSalary * 0.01;
                const netSalary = grossSalary - taxAmount - adminFee;
                return {
                    baseAmount, increaseValue, bonusAmount, grossSalary,
                    taxAmount, taxPercent: finalTaxPercent, adminFee, netSalary
                };
            }
            
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
            
            function renderPayslip(data) {
                const { companyName, companyAddress, employeeName, employeePosition, baseSalary, increasePercent, bonus, currency, salaryCalc, monthName, dayDate, yearValue, customTaxPercent, logoDataURL } = data;
                const isIDR = currency === 'IDR';
                const periodText = dayDate && dayDate !== '' ? `${dayDate} ${monthName} ${yearValue}` : `${monthName} ${yearValue}`;
                
                let baseFormatted, increaseFormatted, bonusFormatted, grossFormatted, taxFormatted, adminFormatted, netFormatted;
                if (isIDR) {
                    baseFormatted = formatCurrencyIDR(salaryCalc.baseAmount);
                    increaseFormatted = formatCurrencyIDR(salaryCalc.increaseValue);
                    bonusFormatted = formatCurrencyIDR(salaryCalc.bonusAmount);
                    grossFormatted = formatCurrencyIDR(salaryCalc.grossSalary);
                    taxFormatted = salaryCalc.taxAmount ? formatCurrencyIDR(salaryCalc.taxAmount) : formatCurrencyIDR(0);
                    adminFormatted = formatCurrencyIDR(salaryCalc.adminFee);
                    netFormatted = formatCurrencyIDR(salaryCalc.netSalary);
                } else {
                    baseFormatted = formatCurrencyUSD(salaryCalc.baseAmount);
                    increaseFormatted = formatCurrencyUSD(salaryCalc.increaseValue);
                    bonusFormatted = formatCurrencyUSD(salaryCalc.bonusAmount);
                    grossFormatted = formatCurrencyUSD(salaryCalc.grossSalary);
                    taxFormatted = salaryCalc.taxAmount ? formatCurrencyUSD(salaryCalc.taxAmount) : formatCurrencyUSD(0);
                    adminFormatted = formatCurrencyUSD(salaryCalc.adminFee);
                    netFormatted = formatCurrencyUSD(salaryCalc.netSalary);
                }
                
                const taxLabel = customTaxPercent > 0 ? (isIDR ? `Pajak (${customTaxPercent}%)` : `Tax (${customTaxPercent}%)`) : null;
                const increaseRow = salaryCalc.increaseValue !== 0 ? `<tr><td>${isIDR ? 'Kenaikan Gaji' : 'Salary Increase'} (${increasePercent}%)</td><td>${increaseFormatted}</td>` : '';
                const bonusRow = salaryCalc.bonusAmount !== 0 ? `<tr><td>${isIDR ? 'Bonus / Insentif' : 'Bonus / Incentive'}</td><td>${bonusFormatted}</td>` : '';
                const taxRow = (customTaxPercent > 0 && salaryCalc.taxAmount > 0) ? `<tr><td>${taxLabel}</td><td>${taxFormatted}</td>` : '';
                
                const addressHtml = (companyAddress && companyAddress.trim() !== '') ? `<div class="company-address">${escapeHtml(companyAddress)}</div>` : '';
                let logoHeaderHtml = '';
                if (logoDataURL) {
                    logoHeaderHtml = `<img src="${logoDataURL}" class="logo-header-img" alt="logo perusahaan">`;
                }
                const positionValue = employeePosition && employeePosition.trim() !== '' ? escapeHtml(employeePosition) : (isIDR ? 'Karyawan' : 'Employee');
                
                return `
                    <div class="payslip-card" id="payslipToDownload">
                        <div class="watermark-bg">
                            <img src="chobank1.png" alt="watermark" onerror="this.style.display='none'">
                        </div>
                        <div class="slip-content-relative">
                            <div class="company-header">
                                ${logoHeaderHtml}
                                <div class="company-name-header">${escapeHtml(companyName)}</div>
                                ${addressHtml}
                            </div>
                            <div class="slip-title">${isIDR ? 'SLIP GAJI BULANAN' : 'MONTHLY PAYSLIP'}</div>
                            <div style="text-align:center;"><div class="period-badge">${periodText}</div></div>
                            
                            <div class="info-row">
                                <span class="info-label">${isIDR ? 'Nama Perusahaan' : 'Company Name'}</span>
                                <span class="info-value">${escapeHtml(companyName)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">${isIDR ? 'Nama Lengkap' : 'Full Name'}</span>
                                <span class="info-value">${escapeHtml(employeeName)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">${isIDR ? 'Posisi / Jabatan' : 'Position'}</span>
                                <span class="info-value">${positionValue}</span>
                            </div>
                            <table class="salary-table">
                                <tr><td>${isIDR ? 'Gaji Pokok' : 'Base Salary'}</td><td>${baseFormatted}</td></tr>
                                ${increaseRow}
                                ${bonusRow}
                                <tr><td style="border-top:1px solid #aaa;">${isIDR ? 'Total Penghasilan Kotor' : 'Total Gross Income'}</td><td style="border-top:1px solid #aaa;">${grossFormatted}</td></tr>
                                ${taxRow}
                                <tr><td>${isIDR ? 'Biaya Admin Chobank (1%)' : 'Admin Fee (1%)'}</td><td>${adminFormatted}</td></tr>
                                <tr class="total-net"><td><strong>${isIDR ? 'GAJI BERSIH (Take Home)' : 'NET SALARY'}</strong></td><td><strong>${netFormatted}</strong></td></tr>
                            </table>
                            <div class="footer-note-slip">For Roleplay Purpose Only, featured by Kachoo in Chobank</div>
                        </div>
                    </div>
                    <button id="downloadPngBtn" class="btn-download">UNDUH SLIP</button>
                `;
            }
            
            async function generateSlip() {
                const companyName = document.getElementById('company-name').value.trim();
                if (!companyName) { alert('Nama perusahaan wajib diisi'); return; }
                const companyAddress = document.getElementById('company-address').value.trim();
                let employeeName = document.getElementById('employee-name').value.trim();
                if (!employeeName) employeeName = 'Nama Lengkap';
                const employeePosition = document.getElementById('employee-position').value.trim();
                let baseSalary = parseFloat(document.getElementById('base-salary').value);
                let increasePercent = parseFloat(document.getElementById('salary-increase').value);
                let bonus = parseFloat(document.getElementById('bonus-extra').value);
                let customTaxPercent = parseFloat(document.getElementById('custom-tax-percent').value);
                if (isNaN(customTaxPercent)) customTaxPercent = 0;
                if (customTaxPercent < 0) customTaxPercent = 0;
                
                const dayDate = document.getElementById('day-date').value.trim();
                const monthName = monthSelect.options[monthSelect.selectedIndex].value;
                let yearValue = document.getElementById('year-date').value.trim();
                if (!yearValue) yearValue = '2026';
                
                const currencyRadios = document.querySelectorAll('input[name="currency"]');
                let currency = 'IDR';
                for (let radio of currencyRadios) if (radio.checked) { currency = radio.value; break; }
                
                if (isNaN(baseSalary) || baseSalary <= 0) { alert('Gaji pokok harus lebih dari 0'); return; }
                if (isNaN(increasePercent)) increasePercent = 0;
                if (isNaN(bonus)) bonus = 0;
                
                loadingDiv.style.display = 'block';
                emptyMessageDiv.style.display = 'none';
                slipContentArea.style.display = 'none';
                await new Promise(r => setTimeout(r, 50));
                
                const salaryCalc = calculateSalaryWithCustomTax(baseSalary, increasePercent, bonus, customTaxPercent);
                
                const slipHTML = renderPayslip({
                    companyName, companyAddress, employeeName, employeePosition,
                    baseSalary, increasePercent, bonus, currency, salaryCalc,
                    monthName, dayDate, yearValue, customTaxPercent,
                    logoDataURL: uploadedLogoDataURL
                });
                
                slipContentArea.innerHTML = slipHTML;
                slipContentArea.style.display = 'block';
                emptyMessageDiv.style.display = 'none';
                loadingDiv.style.display = 'none';
                
                const downloadBtn = document.getElementById('downloadPngBtn');
                if (downloadBtn) {
                    downloadBtn.addEventListener('click', async function() {
                        const element = document.getElementById('payslipToDownload');
                        if (!element) return;
                        try {
                            const canvas = await html2canvas(element, { scale: 2.8, backgroundColor: '#ffffff', logging: false, useCORS: true });
                            const link = document.createElement('a');
                            const safeName = employeeName.replace(/\s/g, '_');
                            link.download = `payslip_${safeName}_${monthName}_${yearValue}.png`;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                        } catch(err) { alert('Gagal download: ' + err); }
                    });
                }
            }
            
            generateBtn.addEventListener('click', generateSlip);
            
            resetBtn.addEventListener('click', function() {
                document.getElementById('company-name').value = '';
                document.getElementById('company-address').value = '';
                document.getElementById('employee-name').value = '';
                document.getElementById('employee-position').value = '';
                document.getElementById('base-salary').value = '';
                document.getElementById('salary-increase').value = '0';
                document.getElementById('bonus-extra').value = '0';
                document.getElementById('custom-tax-percent').value = '0';
                document.getElementById('day-date').value = '';
                const now = new Date();
                monthSelect.value = monthOptions[now.getMonth()];
                document.getElementById('year-date').value = now.getFullYear();
                const idrRadio = document.querySelector('input[name="currency"][value="IDR"]');
                if (idrRadio) idrRadio.checked = true;
                if (logoUpload) { logoUpload.value = ''; uploadedLogoDataURL = null; document.getElementById('logoPreview').innerHTML = ''; }
                slipContentArea.style.display = 'none';
                emptyMessageDiv.style.display = 'block';
                emptyMessageDiv.innerHTML = 'Silakan isi data dan klik Generate Slip Gaji';
            });
            
            slipContentArea.style.display = 'none';
            emptyMessageDiv.style.display = 'block';
        });
    </script>
</body>
    </html>
