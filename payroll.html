<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHOBANK - Sistem Payroll</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            color: #000000;
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            font-family: 'Outfit', 'Montserrat', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 20% 35%, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 24px 48px;
            position: relative;
            z-index: 2;
        }

        .site-header {
            text-align: center;
            margin-bottom: 32px;
            padding: 12px 0 8px;
            background: transparent;
        }

        .header-chobank {
            font-family: 'Outfit', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #000000;
            line-height: 1.2;
        }

        .tagline-mini {
            font-size: 0.9rem;
            color: #4a4a4a;
            margin-top: 8px;
            font-weight: 500;
        }

        .form-container {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 48px;
            padding: 32px 28px;
            width: 100%;
            box-shadow: 0 15px 35px -12px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .form-container:hover {
            background: rgba(255,255,255,0.82);
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12);
        }

        .form-container h2 {
            font-size: 28px;
            margin-bottom: 28px;
            color: #000000;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.2px;
            font-family: 'Outfit', sans-serif;
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .form-container h2:after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: #000;
            margin: 12px auto 0;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #000000;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid rgba(0,0,0,0.2);
            border-radius: 32px;
            background-color: #ffffff;
            color: #111;
            font-size: 15px;
            transition: all 0.25s ease;
            font-family: 'Outfit', sans-serif;
            outline: none;
        }

        .form-control:focus {
            border-color: #000000;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
            transform: translateY(-1px);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 16px;
        }

        .currency-group {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .currency-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .currency-option input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .row-2cols {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .row-2cols .form-group {
            flex: 1;
            min-width: 140px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 32px;
            width: 100%;
        }

        .action-btn {
            display: block;
            padding: 14px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            border: 1.5px solid #000000;
            font-size: 0.95rem;
            text-align: center;
            width: 100%;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            background: transparent;
        }

        .btn-primary {
            background: #000000;
            color: #ffffff;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }

        .btn-primary:hover {
            background: #1c1c1c;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -6px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: rgba(0,0,0,0.02);
            color: #000000;
            border: 1.5px solid #111;
        }

        .btn-secondary:hover {
            background: rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 28px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-family: 'Outfit', sans-serif;
        }

        .footer-contacts {
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #2c2c2c;
            line-height: 1.8;
        }

        .footer-contacts a {
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dotted #000;
        }

        .footer-contacts a:hover {
            opacity: 0.7;
        }

        footer p {
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: #4a4a4a;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #eee;
            border-top: 3px solid #000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeSlide 0.5s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slip-preview-container {
            margin-top: 32px;
        }

        .payslip-card {
            background: white;
            color: black;
            padding: 28px 24px;
            border: 1px solid #ccc;
            box-shadow: 0 12px 28px rgba(0,0,0,0.1);
            max-width: 700px;
            margin: 0 auto;
            font-family: 'Outfit', sans-serif;
            border-radius: 24px;
        }

        .company-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .company-name-header {
            font-size: 26px;
            font-weight: 800;
        }

        .company-address {
            font-size: 11px;
            font-weight: 400;
            color: #4a4a4a;
            margin-top: 6px;
        }

        .slip-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin: 12px 0 10px;
            text-transform: uppercase;
        }

        .period-badge {
            text-align: center;
            background: #f0f0f0;
            display: inline-block;
            width: auto;
            padding: 5px 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            border-radius: 40px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            border-bottom: 1px dotted #ddd;
            padding-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .info-label {
            font-weight: 600;
        }

        .info-value {
            font-weight: 500;
            text-align: right;
            word-break: break-word;
        }

        .salary-table {
            width: 100%;
            border-collapse: collapse;
            margin: 18px 0;
            font-size: 14px;
        }

        .salary-table td {
            padding: 10px 6px;
            border-bottom: 1px solid #ccc;
        }

        .salary-table tr:last-child td {
            border-bottom: none;
        }

        .salary-table td:first-child {
            font-weight: 600;
            width: 65%;
        }

        .salary-table td:last-child {
            text-align: right;
            font-weight: 600;
        }

        .total-net {
            background: #f4f4f4;
            font-weight: 800;
            border-top: 2px solid #000;
        }

        .total-net td {
            padding: 12px 6px;
        }

        .footer-note-slip {
            margin-top: 24px;
            text-align: center;
            font-size: 9px;
            font-weight: 400;
            color: #6b6b6b;
            border-top: 1px solid #ccc;
            padding-top: 12px;
        }

        .btn-download {
            background: #000000;
            color: white;
            padding: 12px 28px;
            font-weight: 700;
            font-family: 'Outfit';
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
            border-radius: 40px;
            margin-top: 20px;
            width: 100%;
        }

        .btn-download:hover {
            background: #2b2b2b;
        }

        .message-empty {
            text-align: center;
            background: #f9f9f9;
            padding: 40px 20px;
            border-radius: 32px;
            color: #777;
        }

        @media (min-width: 768px) {
            .container { padding: 28px 36px 48px; }
            .action-buttons { flex-direction: row; gap: 18px; }
            .action-btn { width: auto; flex: 1; }
        }

        @media (max-width: 480px) {
            .header-chobank { font-size: 1.8rem; }
            .form-container { padding: 24px 20px; }
            .payslip-card { padding: 18px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="site-header">
            <div class="header-chobank">CHOBANK</div>
            <div class="tagline-mini">Sistem Payroll</div>
        </div>

        <main class="main-content">
            <section class="form-container fade-in">
                <h2>Buat Slip Gaji</h2>
                
                <form id="payroll-form">
                    <div class="form-group">
                        <label for="company-name">Nama Perusahaan</label>
                        <input type="text" id="company-name" class="form-control" placeholder="Nama Perusahaan" value="CHOBANK" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="company-address">Alamat Perusahaan (untuk slip)</label>
                        <input type="text" id="company-address" class="form-control" placeholder="Jl. Contoh No. 123, Jakarta" value="Jl. Sudirman No. 45, Jakarta Selatan">
                    </div>
                    
                    <div class="form-group">
                        <label for="employee-name">Nama Karyawan (Lengkap)</label>
                        <input type="text" id="employee-name" class="form-control" placeholder="Nama lengkap karyawan" value="Nama Lengkap" required>
                    </div>

                    <div class="form-group">
                        <label for="employee-position" id="positionLabel">Posisi / Jabatan</label>
                        <input type="text" id="employee-position" class="form-control" placeholder="Contoh: Manager, Staff" value="Karyawan">
                    </div>
                    
                    <div class="row-2cols">
                        <div class="form-group">
                            <label for="base-salary">Gaji Pokok</label>
                            <input type="number" id="base-salary" class="form-control" placeholder="0" value="5000000" step="1000" required>
                        </div>
                        <div class="form-group">
                            <label for="salary-increase">Kenaikan Gaji (%)</label>
                            <input type="number" id="salary-increase" class="form-control" placeholder="Persen" value="0" step="0.5">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Mata Uang</label>
                        <div class="currency-group">
                            <label class="currency-option">
                                <input type="radio" name="currency" value="IDR" checked> Rupiah (IDR)
                            </label>
                            <label class="currency-option">
                                <input type="radio" name="currency" value="USD"> Dollar (USD)
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="month-select">Periode Bulan</label>
                        <select id="month-select" class="form-control">
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September">September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="bonus-extra">Bonus / Insentif (Opsional)</label>
                        <input type="number" id="bonus-extra" class="form-control" placeholder="0" value="0" step="100000">
                    </div>
                    
                    <div class="action-buttons">
                        <button type="button" id="generate-slip-btn" class="action-btn btn-primary">Generate Slip Gaji</button>
                        <button type="reset" class="action-btn btn-secondary">Reset Form</button>
                    </div>
                </form>
            </section>
            
            <div class="slip-preview-container" id="slipPreviewContainer">
                <div class="message-empty" id="emptyMessage">
                    Silakan isi data dan klik Generate Slip Gaji
                </div>
                <div id="slipContentArea" style="display: none;"></div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Memproses...</p>
            </div>
        </main>
        
        <footer>
            <div class="footer-contacts">
                <div>Official Account : <a href="https://x.com/thekachoo" target="_blank" rel="noopener noreferrer">@thekachoo</a></div>
                <div>Contact Person for Chobank : <a href="https://x.com/tuaipuji" target="_blank" rel="noopener noreferrer">@tuaipuji</a></div>
                <div>Gmail : <a href="mailto:ohkachoo@gmail.com">ohkachoo@gmail.com</a></div>
            </div>
            <p>© 2026 CHOBANK. All rights reserved.</p>
            <p>Featured by The Kachoo</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generate-slip-btn');
            const resetBtn = document.querySelector('button[type="reset"]');
            const loadingDiv = document.getElementById('loading');
            const emptyMessageDiv = document.getElementById('emptyMessage');
            const slipContentArea = document.getElementById('slipContentArea');
            
            // Set default month to current month
            const currentDate = new Date();
            const currentMonthIndex = currentDate.getMonth();
            const monthSelect = document.getElementById('month-select');
            const monthOptions = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            if (currentMonthIndex >= 0 && currentMonthIndex <= 11) {
                monthSelect.value = monthOptions[currentMonthIndex];
            } else {
                monthSelect.value = 'Mei';
            }
            
            // Progressive Tax untuk Rupiah (IDR) - hitung persentase efektif
            function calculateTaxIDR(grossIncome) {
                let tax = 0;
                let percent = 0;
                if (grossIncome <= 60000000) {
                    tax = grossIncome * 0.05;
                    percent = 5;
                } else if (grossIncome <= 250000000) {
                    tax = 60000000 * 0.05 + (grossIncome - 60000000) * 0.15;
                    percent = 15;
                } else if (grossIncome <= 500000000) {
                    tax = 60000000 * 0.05 + (250000000 - 60000000) * 0.15 + (grossIncome - 250000000) * 0.25;
                    percent = 25;
                } else if (grossIncome <= 5000000000) {
                    tax = 60000000 * 0.05 + (250000000 - 60000000) * 0.15 + (500000000 - 250000000) * 0.25 + (grossIncome - 500000000) * 0.30;
                    percent = 30;
                } else {
                    tax = 60000000 * 0.05 + (250000000 - 60000000) * 0.15 + (500000000 - 250000000) * 0.25 + (5000000000 - 500000000) * 0.30 + (grossIncome - 5000000000) * 0.35;
                    percent = 35;
                }
                return { tax, percent };
            }
            
            // Progressive Tax untuk Dollar (USD)
            function calculateTaxUSD(grossIncome) {
                let tax = 0;
                let percent = 0;
                if (grossIncome <= 11925) {
                    tax = grossIncome * 0.10;
                    percent = 10;
                } else if (grossIncome <= 48475) {
                    tax = 11925 * 0.10 + (grossIncome - 11925) * 0.12;
                    percent = 12;
                } else if (grossIncome <= 103350) {
                    tax = 11925 * 0.10 + (48475 - 11925) * 0.12 + (grossIncome - 48475) * 0.22;
                    percent = 22;
                } else if (grossIncome <= 197300) {
                    tax = 11925 * 0.10 + (48475 - 11925) * 0.12 + (103350 - 48475) * 0.22 + (grossIncome - 103350) * 0.24;
                    percent = 24;
                } else if (grossIncome <= 250525) {
                    tax = 11925 * 0.10 + (48475 - 11925) * 0.12 + (103350 - 48475) * 0.22 + (197300 - 103350) * 0.24 + (grossIncome - 197300) * 0.32;
                    percent = 32;
                } else if (grossIncome <= 626350) {
                    tax = 11925 * 0.10 + (48475 - 11925) * 0.12 + (103350 - 48475) * 0.22 + (197300 - 103350) * 0.24 + (250525 - 197300) * 0.32 + (grossIncome - 250525) * 0.35;
                    percent = 35;
                } else {
                    tax = 11925 * 0.10 + (48475 - 11925) * 0.12 + (103350 - 48475) * 0.22 + (197300 - 103350) * 0.24 + (250525 - 197300) * 0.32 + (626350 - 250525) * 0.35 + (grossIncome - 626350) * 0.37;
                    percent = 37;
                }
                return { tax, percent };
            }
            
            function formatCurrencyIDR(amount) {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(amount);
            }
            
            function formatCurrencyUSD(amount) {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(amount);
            }
            
            function calculateSalary(baseAmount, increasePercent, bonusAmount, currency) {
                const increaseValue = baseAmount * (increasePercent / 100);
                const grossSalary = baseAmount + increaseValue + bonusAmount;
                
                let taxResult;
                if (currency === 'IDR') {
                    taxResult = calculateTaxIDR(grossSalary);
                } else {
                    taxResult = calculateTaxUSD(grossSalary);
                }
                
                const adminFee = grossSalary * 0.01;
                const netSalary = grossSalary - taxResult.tax - adminFee;
                return {
                    baseAmount: baseAmount,
                    increaseValue: increaseValue,
                    bonusAmount: bonusAmount,
                    grossSalary: grossSalary,
                    tax: taxResult.tax,
                    taxPercent: taxResult.percent,
                    adminFee: adminFee,
                    netSalary: netSalary
                };
            }
            
            function getMonthYearString(monthName, currency) {
                const year = 2026;
                if (currency === 'IDR') {
                    return `${monthName} ${year}`;
                } else {
                    const monthMap = {
                        'Januari': 'January', 'Februari': 'February', 'Maret': 'March', 'April': 'April',
                        'Mei': 'May', 'Juni': 'June', 'Juli': 'July', 'Agustus': 'August',
                        'September': 'September', 'Oktober': 'October', 'November': 'November', 'Desember': 'December'
                    };
                    return `${monthMap[monthName]} ${year}`;
                }
            }
            
            function updatePositionLabel() {
                const currencyRadios = document.querySelectorAll('input[name="currency"]');
                let currency = 'IDR';
                for (let radio of currencyRadios) {
                    if (radio.checked) {
                        currency = radio.value;
                        break;
                    }
                }
                const positionLabel = document.getElementById('positionLabel');
                if (currency === 'IDR') {
                    positionLabel.innerHTML = 'Posisi / Jabatan';
                } else {
                    positionLabel.innerHTML = 'Position / Job Title';
                }
            }
            
            const currencyRadios = document.querySelectorAll('input[name="currency"]');
            currencyRadios.forEach(radio => {
                radio.addEventListener('change', updatePositionLabel);
            });
            updatePositionLabel();
            
            function renderPayslip(data) {
                const { companyName, companyAddress, employeeName, employeePosition, baseSalary, increasePercent, bonus, currency, salaryCalc, monthName } = data;
                const period = getMonthYearString(monthName, currency);
                const isIDR = currency === 'IDR';
                
                let baseFormatted, increaseFormatted, bonusFormatted, grossFormatted, taxFormatted, adminFormatted, netFormatted;
                if (isIDR) {
                    baseFormatted = formatCurrencyIDR(salaryCalc.baseAmount);
                    increaseFormatted = formatCurrencyIDR(salaryCalc.increaseValue);
                    bonusFormatted = formatCurrencyIDR(salaryCalc.bonusAmount);
                    grossFormatted = formatCurrencyIDR(salaryCalc.grossSalary);
                    taxFormatted = formatCurrencyIDR(salaryCalc.tax);
                    adminFormatted = formatCurrencyIDR(salaryCalc.adminFee);
                    netFormatted = formatCurrencyIDR(salaryCalc.netSalary);
                } else {
                    baseFormatted = formatCurrencyUSD(salaryCalc.baseAmount);
                    increaseFormatted = formatCurrencyUSD(salaryCalc.increaseValue);
                    bonusFormatted = formatCurrencyUSD(salaryCalc.bonusAmount);
                    grossFormatted = formatCurrencyUSD(salaryCalc.grossSalary);
                    taxFormatted = formatCurrencyUSD(salaryCalc.tax);
                    adminFormatted = formatCurrencyUSD(salaryCalc.adminFee);
                    netFormatted = formatCurrencyUSD(salaryCalc.netSalary);
                }
                
                const taxLabel = isIDR ? `Pajak Penghasilan (${salaryCalc.taxPercent}%)` : `Income Tax (${salaryCalc.taxPercent}%)`;
                
                const labels = isIDR ? {
                    baseLabel: 'Gaji Pokok',
                    increaseLabel: `Kenaikan Gaji (${increasePercent}%)`,
                    bonusLabel: 'Bonus / Insentif',
                    grossLabel: 'Total Penghasilan Kotor',
                    taxLabel: taxLabel,
                    adminLabel: 'Biaya Admin Chobank (1%)',
                    netLabel: 'GAJI BERSIH (Take Home)',
                    positionLabel: 'Posisi / Jabatan',
                    footerSlip: 'For Roleplay Purpose Only, featured by Kachoo in Chobank'
                } : {
                    baseLabel: 'Base Salary',
                    increaseLabel: `Salary Increase (${increasePercent}%)`,
                    bonusLabel: 'Bonus / Incentive',
                    grossLabel: 'Total Gross Income',
                    taxLabel: taxLabel,
                    adminLabel: 'Chobank Admin Fee (1%)',
                    netLabel: 'NET SALARY (Take Home)',
                    positionLabel: 'Position / Job Title',
                    footerSlip: 'For Roleplay Purpose Only, featured by Kachoo in Chobank'
                };
                
                const increaseRow = salaryCalc.increaseValue !== 0 ? `
                    <tr>
                        <td>${labels.increaseLabel}</td>
                        <td>${increaseFormatted}</td>
                    </tr>
                ` : '';
                
                const bonusRow = salaryCalc.bonusAmount !== 0 ? `
                    <tr>
                        <td>${labels.bonusLabel}</td>
                        <td>${bonusFormatted}</td>
                    </tr>
                ` : '';
                
                const addressHtml = companyAddress ? `<div class="company-address">${escapeHtml(companyAddress)}</div>` : '<div class="company-address">Jakarta, Indonesia</div>';
                const positionValue = employeePosition && employeePosition.trim() !== '' ? escapeHtml(employeePosition) : (isIDR ? 'Karyawan' : 'Employee');
                
                return `
                    <div class="payslip-card" id="payslipToDownload">
                        <div class="company-header">
                            <div class="company-name-header">${escapeHtml(companyName)}</div>
                            ${addressHtml}
                        </div>
                        <div class="slip-title">${isIDR ? 'SLIP GAJI BULANAN' : 'MONTHLY PAYSLIP'}</div>
                        <div style="text-align:center;">
                            <div class="period-badge">${period}</div>
                        </div>
                        <div class="info-row">
                            <span class="info-label">${isIDR ? 'Nama Karyawan' : 'Employee Name'}</span>
                            <span class="info-value">${escapeHtml(employeeName)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">${labels.positionLabel}</span>
                            <span class="info-value">${positionValue}</span>
                        </div>
                        <table class="salary-table">
                            <tr>
                                <td>${labels.baseLabel}</td>
                                <td>${baseFormatted}</td>
                            </tr>
                            ${increaseRow}
                            ${bonusRow}
                            <tr>
                                <td style="border-top:1px solid #aaa;">${labels.grossLabel}</td>
                                <td style="border-top:1px solid #aaa;">${grossFormatted}</td>
                            </tr>
                            <tr>
                                <td>${labels.taxLabel}</td>
                                <td>${taxFormatted}</td>
                            </tr>
                            <tr>
                                <td>${labels.adminLabel}</td>
                                <td>${adminFormatted}</td>
                            </tr>
                            <tr class="total-net">
                                <td><strong>${labels.netLabel}</strong></td>
                                <td><strong>${netFormatted}</strong></td>
                            </tr>
                        </table>
                        <div class="footer-note-slip">${labels.footerSlip}</div>
                    </div>
                    <button id="downloadPngBtn" class="btn-download">UNDUH SLIP</button>
                `;
            }
            
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
            
            async function generateSlip() {
                const companyName = document.getElementById('company-name').value.trim();
                const companyAddress = document.getElementById('company-address').value.trim();
                let employeeName = document.getElementById('employee-name').value.trim();
                const employeePosition = document.getElementById('employee-position').value.trim();
                let baseSalary = parseFloat(document.getElementById('base-salary').value);
                let increasePercent = parseFloat(document.getElementById('salary-increase').value);
                let bonus = parseFloat(document.getElementById('bonus-extra').value);
                const monthSelect = document.getElementById('month-select');
                const monthName = monthSelect.options[monthSelect.selectedIndex].value;
                
                const currencyRadios = document.querySelectorAll('input[name="currency"]');
                let currency = 'IDR';
                for (let radio of currencyRadios) {
                    if (radio.checked) {
                        currency = radio.value;
                        break;
                    }
                }
                
                if (!companyName) {
                    alert('Nama perusahaan wajib diisi');
                    return;
                }
                if (!employeeName) {
                    employeeName = 'Nama Lengkap';
                }
                if (isNaN(baseSalary) || baseSalary <= 0) {
                    alert('Gaji pokok harus lebih dari 0');
                    return;
                }
                if (isNaN(increasePercent)) increasePercent = 0;
                if (isNaN(bonus)) bonus = 0;
                
                loadingDiv.style.display = 'block';
                emptyMessageDiv.style.display = 'none';
                slipContentArea.style.display = 'none';
                
                await new Promise(r => setTimeout(r, 200));
                
                const salaryCalc = calculateSalary(baseSalary, increasePercent, bonus, currency);
                
                const slipHTML = renderPayslip({
                    companyName: companyName,
                    companyAddress: companyAddress,
                    employeeName: employeeName,
                    employeePosition: employeePosition,
                    baseSalary: baseSalary,
                    increasePercent: increasePercent,
                    bonus: bonus,
                    currency: currency,
                    salaryCalc: salaryCalc,
                    monthName: monthName
                });
                
                slipContentArea.innerHTML = slipHTML;
                slipContentArea.style.display = 'block';
                emptyMessageDiv.style.display = 'none';
                loadingDiv.style.display = 'none';
                
                const downloadBtn = document.getElementById('downloadPngBtn');
                if (downloadBtn) {
                    downloadBtn.addEventListener('click', async function() {
                        const element = document.getElementById('payslipToDownload');
                        if (!element) return;
                        try {
                            const canvas = await html2canvas(element, {
                                scale: 2.8,
                                backgroundColor: '#ffffff',
                                logging: false,
                                useCORS: false
                            });
                            const link = document.createElement('a');
                            const safeName = employeeName.replace(/\s/g, '_');
                            const fileName = `payslip_${safeName}_${monthName}_2026.png`;
                            link.download = fileName;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                        } catch(err) {
                            alert('Gagal generate gambar: ' + err);
                        }
                    });
                }
            }
            
            generateBtn.addEventListener('click', generateSlip);
            
            resetBtn.addEventListener('click', function() {
                document.getElementById('company-name').value = 'CHOBANK';
                document.getElementById('company-address').value = 'Jl. Sudirman No. 45, Jakarta Selatan';
                document.getElementById('employee-name').value = 'Nama Lengkap';
                document.getElementById('employee-position').value = 'Karyawan';
                document.getElementById('base-salary').value = '5000000';
                document.getElementById('salary-increase').value = '0';
                document.getElementById('bonus-extra').value = '0';
                const currentMonth = new Date().getMonth();
                monthSelect.value = monthOptions[currentMonth];
                const idrRadio = document.querySelector('input[name="currency"][value="IDR"]');
                if (idrRadio) idrRadio.checked = true;
                updatePositionLabel();
                slipContentArea.style.display = 'none';
                emptyMessageDiv.style.display = 'block';
                emptyMessageDiv.innerHTML = 'Silakan isi data dan klik Generate Slip Gaji';
            });
            
            slipContentArea.style.display = 'none';
            emptyMessageDiv.style.display = 'block';
        });
    </script>
</body>
</html>
