<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>CHOBANK - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            color: #000000;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 440px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .header .logout {
            color: #666;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 12px;
            background: #f0f0f0;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            font-family: 'Outfit', sans-serif;
        }
        .header .logout:hover {
            background: #000;
            color: #fff;
        }
        .greeting {
            margin-bottom: 20px;
        }
        .greeting .name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .greeting h2 {
            font-size: 1.6rem;
            font-weight: 700;
            display: inline;
        }
        .greeting .badge {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: none;
        }
        .greeting .badge.show {
            display: inline-block;
        }
        .greeting .badge.owner {
            background: rgba(255,215,0,0.2);
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.4);
        }
        .greeting .badge.admin {
            background: rgba(100,200,255,0.15);
            color: #64c8ff;
            border: 1px solid rgba(100,200,255,0.3);
        }
        .greeting .username {
            color: #666;
            font-size: 0.9rem;
            font-weight: 400;
            margin-top: 2px;
        }
        .greeting .edit-name-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .greeting .edit-name-btn:hover {
            background: #f0f0f0;
            color: #000;
        }
        .account-number {
            background: #f0f0f0;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .account-number .label {
            font-size: 0.75rem;
            color: #888;
            font-weight: 500;
        }
        .account-number .number {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .account-number .copy-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .account-number .copy-btn:hover {
            background: #e0e0e0;
            color: #000;
        }
        .balance-card {
            background: #000000;
            color: #ffffff;
            border-radius: 24px;
            padding: 28px 24px;
            margin-bottom: 20px;
            position: relative;
        }
        .balance-card .label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            font-weight: 400;
        }
        .balance-card .amount {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 4px 0;
        }
        .balance-card .amount-rp {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
        }
        .balance-card .edit-balance-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: rgba(255,255,255,0.5);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .balance-card .edit-balance-btn:hover {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }
        .balance-card .edit-balance-btn.show {
            display: flex;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .actions .btn-action {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .actions .btn-send {
            background: #000000;
            color: #ffffff;
        }
        .actions .btn-send:hover {
            background: #1e1e1e;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -6px rgba(0,0,0,0.2);
        }
        .actions .btn-receive {
            background: #f0f0f0;
            color: #000000;
        }
        .actions .btn-receive:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        .history-section h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .history-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .history-item .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .history-item .icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .history-item .icon.credit {
            background: #dcfce7;
            color: #16a34a;
        }
        .history-item .icon.debit {
            background: #fee2e2;
            color: #dc2626;
        }
        .history-item .details .title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .history-item .details .sub {
            font-size: 0.75rem;
            color: #888;
        }
        .history-item .amount {
            font-weight: 700;
            font-size: 1rem;
        }
        .history-item .amount.credit {
            color: #16a34a;
        }
        .history-item .amount.debit {
            color: #dc2626;
        }
        .empty-history {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 0.9rem;
        }
        .empty-history i {
            font-size: 2.5rem;
            color: #ddd;
            display: block;
            margin-bottom: 12px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        .modal h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .modal .sub {
            color: #666;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
        }
        .modal .info-box {
            background: #f5f5f5;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }
        .modal .info-box .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .modal .info-box .row:last-child {
            border-bottom: none;
        }
        .modal .info-box .label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal .info-box .value {
            font-weight: 600;
            font-size: 0.95rem;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal .info-box .copy-small {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .modal .info-box .copy-small:hover {
            background: #e0e0e0;
            color: #000;
        }
        .modal .btn-close {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #000000;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal .btn-close:hover {
            background: #1e1e1e;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000;
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-family: 'Outfit', sans-serif;
            display: none;
            z-index: 2000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .toast.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @media (max-width: 480px) {
            .balance-card .amount {
                font-size: 2.2rem;
            }
            .actions .btn-action {
                font-size: 0.85rem;
                padding: 14px;
            }
            .modal {
                padding: 24px 18px;
            }
            .greeting .name-row {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>CHOBANK</h1>
            <button class="logout" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <div class="greeting">
            <div class="name-row">
                <h2>Hello, <span id="userFullName">User</span></h2>
                <span class="badge owner" id="ownerBadge">OWNER</span>
                <span class="badge admin" id="adminBadge">ADMIN</span>
                <button class="edit-name-btn" onclick="openEditName()" title="Edit Full Name">
                    <i class="fas fa-pen"></i>
                </button>
            </div>
            <p class="username">@<span id="userUsername">username</span></p>
        </div>

        <div class="account-number">
            <div>
                <div class="label">ACCOUNT NUMBER</div>
                <div class="number" id="userAccountNumber">---- ----</div>
            </div>
            <button class="copy-btn" onclick="copyAccountNumber()">
                <i class="fas fa-copy"></i>
            </button>
        </div>

        <div class="balance-card">
            <button class="edit-balance-btn" id="editBalanceBtn" onclick="openEditBalance()" title="Edit Balance">
                <i class="fas fa-pen"></i>
            </button>
            <div class="label">Total Balance</div>
            <div class="amount">$<span id="userBalanceUSD">0.00</span></div>
            <div class="amount-rp">Rp <span id="userBalanceIDR">0</span></div>
        </div>

        <div class="actions">
            <button class="btn-action btn-send" onclick="goToSend()">
                <i class="fas fa-paper-plane"></i> Send
            </button>
            <button class="btn-action btn-receive" onclick="showReceive()">
                <i class="fas fa-arrow-down"></i> Receive
            </button>
        </div>

        <div class="history-section">
            <h3><i class="fas fa-clock"></i> Transaction History</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- RECEIVE MODAL - TAMPIL USERNAME + ACCOUNT NUMBER -->
    <div class="modal-overlay" id="receiveModal">
        <div class="modal">
            <h3>Receive Money</h3>
            <p class="sub">Share your CHOBANK info to receive payment</p>
            <div class="info-box">
                <div class="row">
                    <span class="label">Username</span>
                    <span class="value">
                        <span id="receiveUsername">-</span>
                        <button class="copy-small" onclick="copyReceiveInfo('username')">
                            <i class="fas fa-copy"></i>
                        </button>
                    </span>
                </div>
                <div class="row">
                    <span class="label">Account Number</span>
                    <span class="value">
                        <span id="receiveAccountNumber">-</span>
                        <button class="copy-small" onclick="copyReceiveInfo('account')">
                            <i class="fas fa-copy"></i>
                        </button>
                    </span>
                </div>
                <div class="row">
                    <span class="label">Full Name</span>
                    <span class="value" id="receiveFullName">-</span>
                </div>
            </div>
            <button class="btn-close" onclick="closeReceive()">Close</button>
        </div>
    </div>

    <!-- Edit Name Modal -->
    <div class="modal-overlay" id="editNameModal">
        <div class="modal">
            <h3>Edit Full Name</h3>
            <p class="sub">Change your display name</p>
            <div id="editNameMessage" class="message-box"></div>
            <div class="form-group">
                <label for="editNameInput">Full Name</label>
                <input type="text" id="editNameInput" placeholder="Enter your full name" required>
            </div>
            <button class="btn-primary" onclick="saveName()">
                <span id="saveNameText">Save</span>
                <span id="saveNameSpinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
            <button class="btn-secondary" onclick="closeEditName()">Cancel</button>
        </div>
    </div>

    <!-- Edit Balance Modal -->
    <div class="modal-overlay" id="editBalanceModal">
        <div class="modal">
            <h3>Edit Balance</h3>
            <p class="sub">Set your CHOBANK balance</p>
            <div id="editBalanceMessage" class="message-box"></div>
            <div class="form-group">
                <label for="editBalanceAmount">Amount (USD)</label>
                <input type="number" id="editBalanceAmount" placeholder="Enter amount" min="0" step="0.01">
            </div>
            <button class="btn-primary" onclick="saveBalance()">
                <span id="saveBalanceText">Save</span>
                <span id="saveBalanceSpinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
            <button class="btn-secondary" onclick="closeEditBalance()">Cancel</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            const SUPABASE_URL = 'https://inrvryaxdlhnyxxztyyt.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlucnZyeWF4ZGxobnl4eHp0eXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MTAxNDYsImV4cCI6MjEwNDI4NjE0Nn0.xrG77jRP9Wg06P1D5aMkcBkRfrVGUDs4nN2CNnpBPd8';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const userId = localStorage.getItem('chobank_user_id');
            const userUsername = localStorage.getItem('chobank_username');

            if (!userId || !userUsername) {
                window.location.href = 'index.html';
                return;
            }

            let currentUser = null;
            
            // RULES: OWNER & ADMIN
            const OWNER = ['kafka'];
            const ADMINS = ['thekachoo', 'kachoo', 'chobank', 'gathur'];
            const CAN_EDIT_BALANCE = [...OWNER, ...ADMINS];

            (async function() {
                try {
                    const { data: userData, error } = await supabase
                        .from('users')
                        .select('*')
                        .eq('id', parseInt(userId))
                        .single();

                    if (error || !userData) {
                        console.error('User not found:', error);
                        localStorage.removeItem('chobank_user_id');
                        localStorage.removeItem('chobank_username');
                        window.location.href = 'index.html';
                        return;
                    }

                    currentUser = userData;
                    
                    const usernameLower = userData.username.toLowerCase();
                    const isOwner = OWNER.includes(usernameLower);
                    const isAdmin = ADMINS.includes(usernameLower);
                    const canEditBalance = CAN_EDIT_BALANCE.includes(usernameLower);
                    
                    if (!canEditBalance && (userData.balance === 0 || userData.balance === null)) {
                        const { error: updateError } = await supabase
                            .from('users')
                            .update({ balance: 5 })
                            .eq('id', parseInt(userId));
                        
                        if (!updateError) {
                            userData.balance = 5;
                            currentUser.balance = 5;
                        }
                    }
                    
                    renderDashboard(isOwner, isAdmin, canEditBalance);

                } catch (error) {
                    console.error('Error:', error);
                    window.location.href = 'index.html';
                }
            })();

            function renderDashboard(isOwner, isAdmin, canEditBalance) {
                const user = currentUser;
                document.getElementById('userFullName').textContent = user.full_name || user.username;
                document.getElementById('userUsername').textContent = user.username;
                document.getElementById('userAccountNumber').textContent = user.account_number || '---- ----';

                const balance = user.balance || 0;
                document.getElementById('userBalanceUSD').textContent = balance.toFixed(2);
                document.getElementById('userBalanceIDR').textContent = (balance * 16000).toLocaleString('id-ID');

                // BADGE
                const ownerBadge = document.getElementById('ownerBadge');
                const adminBadge = document.getElementById('adminBadge');
                
                if (isOwner) {
                    ownerBadge.classList.add('show');
                    adminBadge.classList.remove('show');
                } else if (isAdmin) {
                    adminBadge.classList.add('show');
                    ownerBadge.classList.remove('show');
                } else {
                    ownerBadge.classList.remove('show');
                    adminBadge.classList.remove('show');
                }

                // EDIT BALANCE BUTTON
                const editBalanceBtn = document.getElementById('editBalanceBtn');
                if (canEditBalance) {
                    editBalanceBtn.classList.add('show');
                } else {
                    editBalanceBtn.classList.remove('show');
                }

                renderHistory(user.history || []);
            }

            function renderHistory(history) {
                const container = document.getElementById('historyList');
                if (!history || history.length === 0) {
                    container.innerHTML = `
                        <div class="empty-history">
                            <i class="fas fa-receipt"></i>
                            No transactions yet
                        </div>
                    `;
                    return;
                }
                const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
                container.innerHTML = sorted.map(item => `
                    <div class="history-item">
                        <div class="left">
                            <div class="icon ${item.type}">
                                <i class="fas ${item.type === 'credit' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                            </div>
                            <div class="details">
                                <div class="title">${item.description || 'Transaction'}</div>
                                <div class="sub">${formatDate(item.date)}</div>
                            </div>
                        </div>
                        <div class="amount ${item.type}">
                            ${item.type === 'credit' ? '+' : '-'} $${item.amount.toFixed(2)}
                        </div>
                    </div>
                `).join('');
            }

            function formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            // =============================================
            // COPY ACCOUNT NUMBER (dari dashboard)
            // =============================================
            window.copyAccountNumber = function() {
                const number = document.getElementById('userAccountNumber').textContent;
                navigator.clipboard.writeText(number).then(() => {
                    showToast('Account number copied');
                }).catch(() => {
                    showToast('Copy manually: ' + number);
                });
            };

            // =============================================
            // RECEIVE MODAL - TAMPIL USERNAME + ACCOUNT NUMBER
            // =============================================
            window.showReceive = function() {
                if (!currentUser) {
                    showToast('Please wait, user data loading...');
                    return;
                }
                
                document.getElementById('receiveUsername').textContent = currentUser.username;
                document.getElementById('receiveAccountNumber').textContent = currentUser.account_number || '----';
                document.getElementById('receiveFullName').textContent = currentUser.full_name || currentUser.username;
                
                document.getElementById('receiveModal').classList.add('active');
            };

            window.closeReceive = function() {
                document.getElementById('receiveModal').classList.remove('active');
            };

            document.getElementById('receiveModal').addEventListener('click', function(e) {
                if (e.target === this) closeReceive();
            });

            // =============================================
            // COPY RECEIVE INFO
            // =============================================
            window.copyReceiveInfo = function(type) {
                let text = '';
                if (type === 'username') {
                    text = document.getElementById('receiveUsername').textContent;
                    showToast('Username copied: @' + text);
                } else if (type === 'account') {
                    text = document.getElementById('receiveAccountNumber').textContent;
                    showToast('Account number copied: ' + text);
                }
                
                navigator.clipboard.writeText(text).catch(() => {
                    // Fallback
                });
            };

            // =============================================
            // EDIT NAME
            // =============================================
            window.openEditName = function() {
                const modal = document.getElementById('editNameModal');
                const input = document.getElementById('editNameInput');
                const msg = document.getElementById('editNameMessage');
                input.value = currentUser ? currentUser.full_name : '';
                msg.className = 'message-box';
                msg.textContent = '';
                msg.style.display = 'none';
                modal.classList.add('active');
                input.focus();
            };

            window.closeEditName = function() {
                document.getElementById('editNameModal').classList.remove('active');
            };

            document.getElementById('editNameModal').addEventListener('click', function(e) {
                if (e.target === this) closeEditName();
            });

            window.saveName = async function() {
                const input = document.getElementById('editNameInput');
                const fullName = input.value.trim();
                const msg = document.getElementById('editNameMessage');
                const btn = document.querySelector('#editNameModal .btn-primary');
                const text = document.getElementById('saveNameText');
                const spinner = document.getElementById('saveNameSpinner');

                msg.className = 'message-box';
                msg.style.display = 'none';

                if (!fullName) {
                    msg.textContent = 'Please enter your full name.';
                    msg.className = 'message-box error';
                    msg.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                text.textContent = 'Saving...';
                spinner.style.display = 'inline';

                try {
                    const { error } = await supabase
                        .from('users')
                        .update({ full_name: fullName })
                        .eq('id', parseInt(userId));

                    if (error) {
                        console.error('Update error:', error);
                        msg.textContent = 'Failed to update name.';
                        msg.className = 'message-box error';
                        msg.style.display = 'block';
                    } else {
                        currentUser.full_name = fullName;
                        document.getElementById('userFullName').textContent = fullName;
                        msg.textContent = 'Name updated successfully!';
                        msg.className = 'message-box success';
                        msg.style.display = 'block';
                        showToast('Name updated to ' + fullName);
                        setTimeout(() => {
                            closeEditName();
                        }, 1500);
                    }
                } catch (err) {
                    console.error('Error:', err);
                    msg.textContent = 'An error occurred. Please try again.';
                    msg.className = 'message-box error';
                    msg.style.display = 'block';
                } finally {
                    btn.disabled = false;
                    text.textContent = 'Save';
                    spinner.style.display = 'none';
                }
            };

            // =============================================
            // EDIT BALANCE (HANYA OWNER & ADMIN)
            // =============================================
            window.openEditBalance = function() {
                const modal = document.getElementById('editBalanceModal');
                const input = document.getElementById('editBalanceAmount');
                const msg = document.getElementById('editBalanceMessage');
                input.value = currentUser ? currentUser.balance : 0;
                msg.className = 'message-box';
                msg.textContent = '';
                msg.style.display = 'none';
                modal.classList.add('active');
                input.focus();
            };

            window.closeEditBalance = function() {
                document.getElementById('editBalanceModal').classList.remove('active');
            };

            document.getElementById('editBalanceModal').addEventListener('click', function(e) {
                if (e.target === this) closeEditBalance();
            });

            window.saveBalance = async function() {
                const input = document.getElementById('editBalanceAmount');
                const amount = parseFloat(input.value.trim());
                const msg = document.getElementById('editBalanceMessage');
                const btn = document.querySelector('#editBalanceModal .btn-primary');
                const text = document.getElementById('saveBalanceText');
                const spinner = document.getElementById('saveBalanceSpinner');

                msg.className = 'message-box';
                msg.style.display = 'none';

                if (isNaN(amount) || amount < 0) {
                    msg.textContent = 'Please enter a valid amount (min 0).';
                    msg.className = 'message-box error';
                    msg.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                text.textContent = 'Saving...';
                spinner.style.display = 'inline';

                try {
                    const { error } = await supabase
                        .from('users')
                        .update({ balance: amount })
                        .eq('id', parseInt(userId));

                    if (error) {
                        console.error('Update error:', error);
                        msg.textContent = 'Failed to update balance.';
                        msg.className = 'message-box error';
                        msg.style.display = 'block';
                    } else {
                        currentUser.balance = amount;
                        document.getElementById('userBalanceUSD').textContent = amount.toFixed(2);
                        document.getElementById('userBalanceIDR').textContent = (amount * 16000).toLocaleString('id-ID');
                        msg.textContent = 'Balance updated successfully!';
                        msg.className = 'message-box success';
                        msg.style.display = 'block';
                        showToast('Balance updated to $' + amount.toFixed(2));
                        setTimeout(() => {
                            closeEditBalance();
                        }, 1500);
                    }
                } catch (err) {
                    console.error('Error:', err);
                    msg.textContent = 'An error occurred. Please try again.';
                    msg.className = 'message-box error';
                    msg.style.display = 'block';
                } finally {
                    btn.disabled = false;
                    text.textContent = 'Save';
                    spinner.style.display = 'none';
                }
            };

            window.goToSend = function() {
                window.location.href = 'transaction.html';
            };

            window.handleLogout = function() {
                localStorage.removeItem('chobank_user_id');
                localStorage.removeItem('chobank_username');
                window.location.href = 'index.html';
            };

            function showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            console.log('Dashboard loaded');
            console.log('User:', currentUser);

        })();
    </script>

</body>
</html>
