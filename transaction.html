<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CHOBANK - Payment Proof Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            color: #000000;
            font-family: 'Outfit', sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 24px 16px 48px;
            position: relative;
            z-index: 2;
        }

        /* HEADER */
        .site-header {
            text-align: center;
            margin-bottom: 28px;
            padding: 8px 0;
        }

        .header-chobank-text {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #000000;
        }

        /* PAYMENT OPTIONS */
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .payment-option {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(14px);
            border-radius: 24px;
            padding: 20px 16px;
            text-align: center;
            transition: all 0.35s ease;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 5px 15px -8px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .payment-option:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.85);
            border-color: rgba(0,0,0,0.15);
        }

        .payment-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #000000;
        }

        .payment-option h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .payment-option p {
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 14px;
        }

        .select-btn {
            background: #000000;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            max-width: 180px;
        }

        .select-btn:hover {
            background: #1a1a1a;
            transform: translateY(-2px);
        }

        /* GENERATOR CONTAINER */
        .generator-container {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            padding: 24px 20px;
            margin-top: 16px;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 10px 25px -10px rgba(0,0,0,0.05);
        }

        .generator-container h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }

        .generator-container > p {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid rgba(0,0,0,0.12);
            border-radius: 20px;
            background-color: #ffffff;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: #000000;
        }

        textarea.form-control {
            min-height: 70px;
            resize: vertical;
        }

        .auto-bank-info {
            background: rgba(0,0,0,0.03);
            border-radius: 16px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 0.75rem;
            border-left: 3px solid #000000;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
        }

        .btn-primary {
            background: #000000;
            color: white;
        }

        .btn-primary:hover {
            background: #1a1a1a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(0,0,0,0.05);
            color: #000000;
            border: 1.5px solid rgba(0,0,0,0.1);
        }

        .btn-secondary:hover {
            background: rgba(0,0,0,0.1);
        }

        /* PREVIEW SECTION - STYLE SEPERTI SLIP GAJI (MEMANJANG/POTRAIT) */
        .preview-section {
            margin-top: 28px;
        }

        .preview-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        .preview-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* INI DIA STYLE SLIP CARD - MEMANJANG KE BAWAH (POTRAIT) SEPERTI SLIP PAYROLL */
        .payslip-card {
            background: white;
            color: black;
            padding: 24px 20px;
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
            font-family: 'Outfit', sans-serif;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .watermark-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
        }
        .watermark-bg img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .slip-content-relative {
            position: relative;
            z-index: 2;
            background: transparent;
        }

        .proof-header {
            text-align: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 14px;
            margin-bottom: 18px;
        }

        .proof-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.2px;
            color: #000;
        }

        .proof-subtitle {
            font-size: 10px;
            font-weight: 400;
            color: #4a4a4a;
            margin-top: 6px;
        }

        .proof-details {
            margin: 16px 0 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            border-bottom: 1px dotted #ddd;
            padding-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .detail-label {
            font-weight: 700;
            color: #222;
        }

        .detail-value {
            font-weight: 500;
            text-align: right;
            word-break: break-word;
            color: #111;
        }

        .detail-value.amount {
            font-size: 1rem;
            font-weight: 800;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            background: #000000;
            color: white;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .highlight-box {
            background: #f8f8f8;
            border-radius: 14px;
            padding: 12px;
            margin: 16px 0;
        }

        .proof-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 8px;
            font-weight: 400;
            color: #6b6b6b;
            border-top: 1px solid #e0e0e0;
            padding-top: 12px;
        }

        .download-options {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .download-btn {
            background: #000000;
            color: white;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            flex: 1;
        }

        .download-btn:hover {
            background: #2c2c2c;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .spinner {
            border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid #000000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-to-index {
            text-align: center;
            margin: 35px 0 25px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.05);
            color: #000;
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .back-btn:hover {
            background: rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.08);
            color: #666;
            font-size: 0.65rem;
        }

        @media (max-width: 450px) {
            .container { padding: 16px 12px; }
            .header-chobank-text { font-size: 2rem; }
            .generator-container { padding: 20px 16px; }
            .payslip-card { padding: 18px 14px; max-width: 340px; }
            .proof-title { font-size: 15px; }
            .detail-row { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="site-header">
            <div class="header-chobank-text">CHOBANK</div>
        </div>

        <div class="payment-options">
            <div class="payment-option fade-in" id="domestic-btn">
                <div class="payment-icon"><i class="fas fa-landmark"></i></div>
                <h2>Domestic Payment</h2>
                <p>Transfer ke bank lokal (Rupiah)</p>
                <button class="select-btn" data-type="domestic">Pilih</button>
            </div>
            
            <div class="payment-option fade-in" id="international-btn">
                <div class="payment-icon"><i class="fas fa-globe-americas"></i></div>
                <h2>International Payment</h2>
                <p>Transfer bank internasional</p>
                <button class="select-btn" data-type="international">Select</button>
            </div>
            
            <div class="payment-option fade-in" id="invoice-btn">
                <div class="payment-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                <h2>Invoice Payment</h2>
                <p>Pembayaran invoice</p>
                <button class="select-btn" data-type="invoice">Pilih</button>
            </div>
        </div>

        <section class="generator-container hidden" id="generator"></section>

        <div class="loading hidden" id="loading">
            <div class="spinner"></div>
            <p>Membuat gambar...</p>
        </div>

        <div class="back-to-index">
            <a href="#" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
        </div>

        <footer>
            <p>© 2026 The Kachoo - Roleplay Purpose Only</p>
        </footer>
    </div>

    <script>
        let currentPaymentType = '';
        
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.select-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const type = this.getAttribute('data-type');
                    currentPaymentType = type;
                    loadPaymentForm(type);
                    document.getElementById('generator').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
        });
        
        function loadPaymentForm(type) {
            const generator = document.getElementById('generator');
            let title, subtitle, currency, showInvoiceField, formLabels, bankType;
            
            if (type === 'domestic') {
                title = 'Pembayaran Dalam Negeri';
                subtitle = 'Transfer ke bank lokal';
                currency = 'IDR';
                showInvoiceField = false;
                bankType = 'Nasional';
                formLabels = {
                    payerName: 'Nama Pengirim', receiverName: 'Nama Penerima',
                    receiverAccount: 'No. Rekening', recipientBank: 'Bank Penerima',
                    amount: 'Jumlah', date: 'Tanggal',
                    currency: 'Mata Uang', invoiceNumber: 'No. Invoice', notes: 'Catatan',
                    placeholderPayerName: 'Nama pengirim', placeholderReceiverName: 'Nama penerima',
                    placeholderReceiverAccount: 'Nomor rekening', placeholderRecipientBank: 'Nama bank',
                    placeholderAmount: 'Jumlah pembayaran', placeholderInvoice: 'Nomor invoice', placeholderNotes: 'Catatan'
                };
            } else if (type === 'international') {
                title = 'International Payment';
                subtitle = 'International Bank Transfer';
                currency = 'USD';
                showInvoiceField = false;
                bankType = 'International';
                formLabels = {
                    payerName: 'Sender Name', receiverName: 'Recipient Name',
                    receiverAccount: 'Account Number', recipientBank: 'Recipient Bank',
                    amount: 'Amount', date: 'Date',
                    currency: 'Currency', invoiceNumber: 'Invoice No', notes: 'Notes',
                    placeholderPayerName: 'Sender name', placeholderReceiverName: 'Recipient name',
                    placeholderReceiverAccount: 'Account number', placeholderRecipientBank: 'Bank name',
                    placeholderAmount: 'Amount', placeholderInvoice: 'Invoice number', placeholderNotes: 'Notes'
                };
            } else {
                title = 'Invoice Payment';
                subtitle = 'Pembayaran Invoice';
                currency = 'IDR';
                showInvoiceField = true;
                bankType = 'Nasional';
                formLabels = {
                    payerName: 'Nama Pengirim', receiverName: 'Nama Penerima',
                    receiverAccount: 'No. Rekening', recipientBank: 'Bank Penerima',
                    amount: 'Jumlah', date: 'Tanggal',
                    currency: 'Mata Uang', invoiceNumber: 'No. Invoice', notes: 'Catatan',
                    placeholderPayerName: 'Nama pengirim', placeholderReceiverName: 'Nama penerima',
                    placeholderReceiverAccount: 'Nomor rekening', placeholderRecipientBank: 'Nama bank',
                    placeholderAmount: 'Jumlah', placeholderInvoice: 'Nomor invoice', placeholderNotes: 'Catatan'
                };
            }
            
            const today = new Date().toISOString().split('T')[0];
            
            let formHTML = `
                <h2>${title}</h2>
                <p>${subtitle}</p>
                <div class="auto-bank-info">
                    <i class="fas fa-info-circle"></i> Bank Pengirim: CHOBANK (${bankType})
                </div>
                <form id="payment-form">
                    <div class="form-group"><label>${formLabels.payerName}</label><input type="text" id="payer-name" class="form-control" placeholder="${formLabels.placeholderPayerName}" required></div>
                    <div class="form-group"><label>${formLabels.receiverName}</label><input type="text" id="receiver-name" class="form-control" placeholder="${formLabels.placeholderReceiverName}" required></div>
                    <div class="form-group"><label>${formLabels.receiverAccount}</label><input type="text" id="receiver-account" class="form-control" placeholder="${formLabels.placeholderReceiverAccount}" required></div>
                    <div class="form-group"><label>${formLabels.recipientBank}</label><input type="text" id="recipient-bank" class="form-control" placeholder="${formLabels.placeholderRecipientBank}" required></div>
                    <div class="form-group"><label>${formLabels.amount}</label><input type="number" id="amount" class="form-control" placeholder="${formLabels.placeholderAmount}" min="1000" required></div>
                    <div class="form-group"><label>${formLabels.date}</label><input type="date" id="date" class="form-control" value="${today}" required></div>
                    <div class="form-group"><label>${formLabels.currency}</label><input type="text" id="currency" class="form-control" value="${currency}" required></div>
                    ${showInvoiceField ? `<div class="form-group"><label>${formLabels.invoiceNumber}</label><input type="text" id="invoice-number" class="form-control" placeholder="${formLabels.placeholderInvoice}"></div>` : ''}
                    <div class="form-group"><label>${formLabels.notes}</label><textarea id="notes" class="form-control" rows="2" placeholder="${formLabels.placeholderNotes}"></textarea></div>
                    <div class="action-buttons">
                        <button type="button" id="generate-btn" class="action-btn btn-primary">Buat Bukti</button>
                        <button type="reset" class="action-btn btn-secondary">Reset</button>
                    </div>
                </form>
                <div class="preview-section hidden" id="preview-section">
                    <h3 class="preview-title">Preview Bukti</h3>
                    <div class="preview-container">
                        <div class="payslip-card" id="proof-preview">
                            <div class="watermark-bg">
                                <img src="chobank1.png" alt="watermark" onerror="this.style.display='none'">
                            </div>
                            <div class="slip-content-relative" id="proof-content-relative"></div>
                        </div>
                    </div>
                    <div class="download-options">
                        <button type="button" id="download-portrait-btn" class="download-btn">Download PNG</button>
                    </div>
                    <div class="action-buttons">
                        <button type="button" id="new-proof-btn" class="action-btn btn-secondary">Buat Baru</button>
                    </div>
                </div>
            `;
            
            generator.innerHTML = formHTML;
            generator.classList.remove('hidden');
            generator.classList.add('fade-in');
            
            setTimeout(() => {
                document.getElementById('generate-btn').addEventListener('click', generateProof);
                document.getElementById('download-portrait-btn').addEventListener('click', downloadProof);
                document.getElementById('new-proof-btn').addEventListener('click', function() {
                    document.getElementById('preview-section').classList.add('hidden');
                    document.getElementById('payment-form').reset();
                    document.getElementById('date').value = today;
                    document.getElementById('currency').value = currency;
                });
            }, 100);
        }
        
        function generateProof() {
            if (!validateForm()) {
                alert('Isi semua field yang diperlukan!');
                return;
            }
            
            const payerName = document.getElementById('payer-name').value;
            const receiverName = document.getElementById('receiver-name').value;
            const receiverAccount = document.getElementById('receiver-account').value;
            const recipientBank = document.getElementById('recipient-bank').value;
            const amount = document.getElementById('amount').value;
            const date = document.getElementById('date').value;
            const currency = document.getElementById('currency').value;
            const invoiceNumber = document.getElementById('invoice-number')?.value || '';
            const notes = document.getElementById('notes').value;
            
            const formattedDate = formatDate(date);
            const referenceNumber = generateReferenceNumber();
            const proofContentRelative = document.getElementById('proof-content-relative');
            const isDomestic = currentPaymentType === 'domestic';
            
            let headerTitle, headerSubtitle, labels;
            
            if (isDomestic) {
                headerTitle = 'BUKTI PEMBAYARAN';
                headerSubtitle = 'Transfer Dalam Negeri';
                labels = {
                    reference: 'No. Referensi', date: 'Tanggal', time: 'Waktu',
                    sender: 'Pengirim', senderBank: 'Bank Pengirim', recipient: 'Penerima',
                    recipientBank: 'Bank Penerima', recipientAccount: 'No. Rekening',
                    amount: 'Jumlah', currency: 'Mata Uang',
                    transactionType: 'Jenis Transaksi', invoiceNumber: 'No. Invoice',
                    status: 'Status', notes: 'Catatan',
                    statusText: 'BERHASIL', transactionTypeText: 'Transfer Dalam Negeri'
                };
            } else {
                headerTitle = currentPaymentType === 'international' ? 'PAYMENT CONFIRMATION' : 'INVOICE PAYMENT';
                headerSubtitle = currentPaymentType === 'international' ? 'International Transfer' : 'Invoice Payment';
                labels = {
                    reference: 'Reference', date: 'Date', time: 'Time',
                    sender: 'Sender', senderBank: 'Sender Bank', recipient: 'Recipient',
                    recipientBank: 'Recipient Bank', recipientAccount: 'Account No',
                    amount: 'Amount', currency: 'Currency',
                    transactionType: 'Transaction Type', invoiceNumber: 'Invoice No',
                    status: 'Status', notes: 'Notes',
                    statusText: 'COMPLETED', transactionTypeText: currentPaymentType === 'international' ? 'International Transfer' : 'Invoice Payment'
                };
            }
            
            let proofContent = `
                <div class="proof-header">
                    <div class="proof-title">${headerTitle}</div>
                    <div class="proof-subtitle">${headerSubtitle}</div>
                </div>
                <div class="proof-details">
                    <div class="detail-row"><span class="detail-label">${labels.reference}</span><span class="detail-value">${referenceNumber}</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.date}</span><span class="detail-value">${formattedDate}</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.time}</span><span class="detail-value">${formatTime(isDomestic)}</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.sender}</span><span class="detail-value">${escapeHtml(payerName)}</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.senderBank}</span><span class="detail-value">CHOBANK</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.recipient}</span><span class="detail-value">${escapeHtml(receiverName)}</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.recipientBank}</span><span class="detail-value">${escapeHtml(recipientBank)}</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.recipientAccount}</span><span class="detail-value">${escapeHtml(receiverAccount)}</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.amount}</span><span class="detail-value amount">${formatCurrency(currency, amount)}</span></div>
                    <div class="detail-row"><span class="detail-label">${labels.transactionType}</span><span class="detail-value">${labels.transactionTypeText}</span></div>
            `;
            
            if (invoiceNumber) {
                proofContent += `<div class="detail-row"><span class="detail-label">${labels.invoiceNumber}</span><span class="detail-value">${escapeHtml(invoiceNumber)}</span></div>`;
            }
            
            proofContent += `<div class="detail-row"><span class="detail-label">${labels.status}</span><span class="detail-value"><span class="status-badge">${labels.statusText}</span></span></div></div>`;
            
            if (notes) {
                proofContent += `<div class="highlight-box"><div style="font-weight:700;margin-bottom:6px;font-size:11px;">${labels.notes}:</div><div style="font-size:11px;">${escapeHtml(notes)}</div></div>`;
            }
            
            proofContent += `<div class="proof-footer">For Roleplay Purpose Only - The Kachoo</div>`;
            
            proofContentRelative.innerHTML = proofContent;
            document.getElementById('preview-section').classList.remove('hidden');
            document.getElementById('preview-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m)); }
        function formatTime(isDomestic) { const now = new Date(); return isDomestic ? now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) : now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:true }); }
        function validateForm() { return ['payer-name','receiver-name','receiver-account','recipient-bank','amount','date','currency'].every(id => { const f = document.getElementById(id); return f && f.value.trim(); }); }
        function formatDate(dateString) { const date = new Date(dateString); return currentPaymentType === 'domestic' ? date.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }) : date.toLocaleDateString('en-US', { day:'numeric', month:'long', year:'numeric' }); }
        function generateReferenceNumber() { let result = 'REF' + Math.floor(Math.random()*900+100) + '-'; for(let i=0;i<6;i++) result += 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'.charAt(Math.floor(Math.random()*34)); return result; }
        function formatCurrency(currency, amount) { const num = parseFloat(amount); return currency.includes('IDR') ? `Rp ${num.toLocaleString('id-ID')}` : currency.includes('USD') ? `$ ${num.toLocaleString('en-US', {minimumFractionDigits:2})}` : `${num.toLocaleString()} ${currency}`; }
        
        function downloadProof() {
            const proofElement = document.getElementById('proof-preview');
            if (!proofElement) { alert('Buat bukti dulu!'); return; }
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            const cloneContainer = document.createElement('div');
            cloneContainer.style.position = 'fixed';
            cloneContainer.style.left = '-9999px';
            cloneContainer.style.top = '-9999px';
            cloneContainer.style.width = '380px';
            cloneContainer.style.backgroundColor = '#ffffff';
            cloneContainer.style.padding = '0';
            const clonedProof = proofElement.cloneNode(true);
            clonedProof.style.margin = '0';
            clonedProof.style.width = '100%';
            clonedProof.style.maxWidth = '380px';
            cloneContainer.appendChild(clonedProof);
            document.body.appendChild(cloneContainer);
            setTimeout(() => {
                html2canvas(cloneContainer, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true, logging: false }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `payment-${currentPaymentType}-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    document.body.removeChild(cloneContainer);
                    loading.classList.add('hidden');
                    alert('Download berhasil!');
                }).catch(e => { console.error(e); document.body.removeChild(cloneContainer); loading.classList.add('hidden'); alert('Gagal download!'); });
            }, 200);
        }
    </script>
